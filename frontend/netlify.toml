# Netlify: solo publica el frontend (React + Vite). El backend y la base de datos van en otro servicio (ver DESPLIEGUE.md).
# En Netlify defina las variables VITE_MAPBOX_TOKEN y VITE_API_URL (dirección del backend, sin /api).
[build]
  base = "frontend"
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La aplicación es de una sola página: rutas como /panel u /ofrecer deben cargar index.html al recargar.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
